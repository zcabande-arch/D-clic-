<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Take Out</title>
<meta name="description" content="La liste de courses partagée de ton foyer (famille, coloc, couple, amis) et ce qu'il y a déjà dans la cuisine.">
<meta name="theme-color" content="#F6F0E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Take Out">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap" id="app"><p class="loading"><img class="logo" src="icons/logo.png" alt="Take Out"></p></div>

<!-- Ajouter / modifier un article -->
<dialog id="sheet">
  <form class="sheet" id="form" method="dialog" autocomplete="off">
    <div class="shead">
      <button type="button" class="round dashed" id="cancelBtn" aria-label="Fermer">✕</button>
      <h3 id="sheetTitle">Nouvel article</h3>
      <button type="submit" class="round ok" id="saveBtn" aria-label="Enregistrer">✓</button>
    </div>
    <div class="field"><label for="fName">Article</label><input id="fName" maxlength="80" required placeholder="ex : Lait d'avoine"></div>
    <div class="row2">
      <div class="field"><label for="fQty">Quantité</label><input id="fQty" maxlength="40" placeholder="ex : 2 paquets"></div>
      <div class="field"><label for="fPrice">Prix</label><div class="money"><input id="fPrice" inputmode="decimal" placeholder="0,00"><span>€</span></div></div>
    </div>
    <div class="field"><label for="fQuality">Qualité / marque</label><input id="fQuality" maxlength="80" placeholder="ex : bio, Barilla"></div>
    <div class="field"><span>Rayon</span><div class="chips" id="fCat"></div></div>
    <div class="field" id="fPrioField"><span>Priorité</span><div class="chips" id="fPrio"></div></div>
    <div class="field" id="fShopField"><span>Où l'acheter</span><div class="chips" id="fShop"></div></div>
    <p class="err" id="fErr"></p>
    <p class="by" id="fBy" hidden></p>
    <button type="submit" class="btn wide">Enregistrer</button>
    <button type="button" class="btn danger wide" id="delBtn" hidden style="margin-top:10px">Supprimer</button>
  </form>
</dialog>

<!-- Panneaux : foyer, profil, invitations… (contenu rempli par app.js) -->
<dialog id="panel"><div class="sheet" id="panelBody"></div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><span class="tacts" id="toastActions"></span></div>
</body>
</html>
