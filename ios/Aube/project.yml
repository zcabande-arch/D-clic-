# Projet Xcode de l'app Aube. Pour l'ouvrir sur un Mac :
#   brew install xcodegen && cd ios/Aube && xcodegen && open Aube.xcodeproj
name: Aube
options:
  bundleIdPrefix: app.aube
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Aube:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aube.reveil
        PRODUCT_NAME: Aube
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Aube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSupportsIndirectInputEvents: true
        NSAlarmKitUsageDescription: "Aube programme une vraie alarme à l'heure du réveil, pour sonner même si le son de la nuit a été coupé."
        ITSAppUsesNonExemptEncryption: false
